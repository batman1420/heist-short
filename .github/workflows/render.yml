name: render-ipo-short
on:
  workflow_dispatch:
jobs:
  render-chunk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { start: 0,    end: 299 }
          - { start: 300,  end: 599 }
          - { start: 600,  end: 899 }
          - { start: 900,  end: 1199 }
          - { start: 1200, end: 1499 }
          - { start: 1500, end: 1799 }
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Download + unpack project
        run: |
          curl -sSL -o project.zip https://github.com/batman1420/heist-short/releases/download/code-v2/project.zip
          unzip -oq project.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Render chunk
        env:
          COMP: IpoShort
          GL: angle-egl
        run: node scripts/seqrender.mjs out/seq ${{ matrix.start }} ${{ matrix.end }}
      - name: QA frames (flags near-white / near-black)
        run: node scripts/qa_frames.mjs out/seq
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.start }}-${{ matrix.end }}
          path: out/seq/
          retention-days: 3
  assemble:
    needs: render-chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download + unpack project
        run: |
          curl -sSL -o project.zip https://github.com/batman1420/heist-short/releases/download/code-v2/project.zip
          unzip -oq project.zip
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: frames
          merge-multiple: true
      - name: Verify frame count
        run: ls frames/element-*.jpg | wc -l && test $(ls frames/element-*.jpg | wc -l) -eq 1800
      - name: Download mix
        run: curl -sSL -O https://github.com/batman1420/heist-short/releases/download/code-v2/mix.wav
      - name: Assemble 2K mp4 with mix + burned Poppins captions
        run: >-
          ffmpeg -framerate 30 -start_number 0 -i frames/element-%04d.jpg -i mix.wav
          -vf "scale=1440:2560,subtitles=captions.ass:fontsdir=assets/fonts"
          -map 0:v -map 1:a -c:v libx264 -pix_fmt yuv420p -crf 17 -preset slow
          -c:a aac -b:a 192k -ar 48000 -shortest -movflags +faststart final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: ipo-short-video
          path: final.mp4
