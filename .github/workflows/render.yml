name: render-ipo-v19-s9-partial
on:
  workflow_dispatch:
    inputs:
      v17_run_id:
        description: Successful v17 run with all nine raw chunk artifacts, verify before dispatch
        type: string
        required: true
        default: "44960698729"
      v18_run_id:
        description: Successful v18 run with its four raw patch artifacts
        type: string
        required: true
        default: "44966804797"
      gl:
        description: Chromium GL backend, test on the runner before a full run
        type: choice
        default: swangle
        options: [swangle, angle-egl]
jobs:
  render-chunk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { start: 821, end: 915 }
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Download + unpack project
        run: |
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o project.zip https://github.com/batman1420/heist-short/releases/download/code-v19/project.zip
          unzip -oq project.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render chunk
        env:
          COMP: IpoShort
          GL: ${{ inputs.gl || 'swangle' }}
        run: node scripts/seqrender.mjs out/seq ${{ matrix.start }} ${{ matrix.end }} 1.3333
      - name: QA frames (flags near-white / near-black)
        run: node scripts/qa_frames.mjs out/seq
      - uses: actions/upload-artifact@v4
        with:
          name: v19-patch-${{ matrix.start }}-${{ matrix.end }}
          path: out/seq/
          retention-days: 3
  assemble:
    permissions:
      contents: read
      actions: read
    needs: render-chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download + unpack project
        run: |
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o project.zip https://github.com/batman1420/heist-short/releases/download/code-v19/project.zip
          unzip -oq project.zip
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download mix + restore mix.wav
        run: |
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -O https://github.com/batman1420/heist-short/releases/download/code-v19/mix.flac
          ffmpeg -i mix.flac -c:a pcm_s24le mix.wav
      - name: Download cached v17 raw frame artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.v17_run_id }}
          pattern: chunk-*
          path: baseline-v17
          merge-multiple: true
      - name: Download cached v18 patch artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.v18_run_id }}
          pattern: v18-patch-*
          path: patch-v18
          merge-multiple: true
      - name: Reconstruct complete v18 raw baseline without rendering
        run: python3 scripts/merge-v18-frames.py baseline-v17 patch-v18 baseline-v18
      - name: Download only current v19 patch artifact
        uses: actions/download-artifact@v4
        with:
          pattern: v19-patch-*
          path: patch-v19
          merge-multiple: true
      - name: Merge the S9-only patch into v18 baseline
        run: python3 scripts/merge-v19-frames.py baseline-v18 patch-v19 frames
      - name: Assemble 2K mp4 with mix + burned Poppins captions
        run: >-
          ffmpeg -framerate 30 -start_number 0 -i frames/el-%04d.jpg -i mix.wav
          -vf "subtitles=captions.ass:fontsdir=assets/fonts"
          -map 0:v -map 1:a -c:v libx264 -pix_fmt yuv420p -crf 16 -preset slow
          -af volume=-0.7dB -c:a aac -b:a 192k -ar 48000 -shortest -movflags +faststart final.mp4
      - name: Measure final AAC loudness and true peak
        run: |
          ffmpeg -hide_banner -i final.mp4 -vn -af loudnorm=I=-15:TP=-1.2:LRA=11:print_format=json -f null - 2> final-audio.log
          cat final-audio.log
          python3 - <<'PY'
          import json,re
          text=open('final-audio.log').read()
          stats=json.loads(re.findall(r'\{[^{}]*"input_i"[^{}]*\}',text,re.S)[-1])
          assert float(stats['input_tp']) <= -1.2, stats
          assert -16.0 <= float(stats['input_i']) <= -14.0, stats
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ipo-short-video-v19
          path: |
            final.mp4
            final-audio.log
            frames/provenance.json
      - name: Preserve merged uncaptioned raw cache for later surgical patches
        uses: actions/upload-artifact@v4
        with:
          name: v19-merged-raw-frames
          path: frames/
          retention-days: 7
